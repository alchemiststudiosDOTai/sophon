[package]
name = "sophon-cli"
version = "0.1.0"
edition = "2024"
description = "Provider-agnostic search CLI for Brave Search and Exa"
license = "MIT"
repository = "https://github.com/alchemiststudiosDOTai/sophon"
readme = "README.md"
keywords = ["search", "cli", "brave", "exa"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
spider = { version = "2", default-features = false, features = ["chrome", "chrome_intercept", "chrome_stealth"] }

[[test]]
name = "search_service_integration"
path = "tests/integration/search_service_test.rs"

[[test]]
name = "provider_registry_integration"
path = "tests/integration/provider_registry_test.rs"

[[test]]
name = "cli_integration"
path = "tests/integration/cli_test.rs"

[dev-dependencies.cargo-husky]
version = "1.5.0"
default-features = false
features = ["user-hooks"]
