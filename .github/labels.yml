# Label definitions for sophon-cli
# These labels are used for priority, type, and area classification.
- name: "P0-critical"
  color: "b60205"
  description: "Critical - blocks release or main workflow"
- name: "P1-high"
  color: "d93f0b"
  description: "High priority - significant impact"
- name: "P2-medium"
  color: "fbca04"
  description: "Medium priority - should be addressed soon"
- name: "P3-low"
  color: "0e8a16"
  description: "Low priority - nice to have"
- name: "bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "feature"
  color: "a2eeef"
  description: "New capability or enhancement"
- name: "chore"
  color: "c2e0c6"
  description: "Maintenance, tooling, or cleanup"
- name: "docs"
  color: "0075ca"
  description: "Documentation related"
- name: "area/cli"
  color: "0052cc"
  description: "Command-line interface layer"
- name: "area/domain"
  color: "0052cc"
  description: "Provider-agnostic domain types"
- name: "area/providers"
  color: "0052cc"
  description: "Search provider adapters"
- name: "area/transport"
  color: "0052cc"
  description: "HTTP client and transport"
- name: "area/tests"
  color: "0052cc"
  description: "Test suite and harness"
- name: "triage"
  color: "cccccc"
  description: "Needs initial review and routing"
